<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ro‘yxatdan o‘tish — Davomat</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/png" href="/img/mark.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="regForm" autocomplete="on">
      <img class="login-logo-img" src="/img/logo.png" alt="Kelajak Markazlari" />
      <h1>Maktabni ro‘yxatdan o‘tkazish</h1>
      <p class="sub">Maktabingizni tanlang va o‘zingizga parol qo‘ying</p>

      <div class="alert error" id="err" hidden></div>
      <div class="alert info" id="info" hidden></div>

      <div class="field">
        <label for="school">Maktab</label>
        <select id="school" required>
          <option value="">Yuklanmoqda…</option>
        </select>
      </div>

      <div class="field">
        <label for="code">Ro‘yxat kodi</label>
        <input type="text" id="code" placeholder="XXXX-XXXX" maxlength="9"
               autocapitalize="characters" autocorrect="off" spellcheck="false" required />
        <div class="small muted" style="margin-top:6px">
          Kod har bir maktabga alohida beriladi — administratordan oling
        </div>
      </div>

      <div class="field">
        <label for="password">Parol qo‘ying</label>
        <input type="password" id="password" autocomplete="new-password" required />
        <div class="pw-meter"><i id="pwBar"></i></div>
        <div class="small muted" id="pwHint" style="margin-top:6px">
          Kamida <span id="minLen">8</span> ta belgi, harf va raqam bo‘lsin
        </div>
      </div>

      <div class="field">
        <label for="repeat">Parolni takrorlang</label>
        <input type="password" id="repeat" autocomplete="new-password" required />
      </div>

      <label class="checkline">
        <input type="checkbox" id="showPw" /> Parolni ko‘rsatish
      </label>

      <button class="btn big" type="submit" id="submitBtn" style="margin-top:14px">
        Ro‘yxatdan o‘tish
      </button>

      <p class="small muted" style="text-align:center;margin:16px 0 0">
        Allaqachon ro‘yxatdan o‘tganmisiz? <a href="/login">Kirish</a>
      </p>
    </form>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/royxat.js"></script>
</body>
</html>
