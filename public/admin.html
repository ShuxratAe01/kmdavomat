<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin panel — Davomat</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">🛡️</span> Admin panel</div>
    <div class="spacer"></div>
    <div class="who">
      <strong id="whoName">—</strong>
      <span>Administrator</span>
    </div>
    <button class="btn sm ghost" id="logoutBtn">Chiqish</button>
  </header>

  <main class="container wide">
    <div class="tabs">
      <button class="tab active" data-tab="overview">📊 Bugungi davomat</button>
      <button class="tab" data-tab="videos">🎬 Videolar</button>
      <button class="tab" data-tab="users">👥 Xodimlar</button>
    </div>

    <div class="alert error" id="err" hidden></div>
    <div class="alert ok" id="ok" hidden></div>

    <!-- ===== Bugungi davomat ===== -->
    <section id="tab-overview">
      <div class="card">
        <div class="row" style="margin-bottom:16px">
          <div class="fixed" style="min-width:190px">
            <label class="small muted" for="ovDay">Sana</label>
            <input type="date" id="ovDay" />
          </div>
          <div class="fixed" style="align-self:flex-end">
            <button class="btn ghost" id="ovToday">Bugun</button>
          </div>
        </div>

        <div class="stats">
          <div class="stat blue"><b id="ovTotal">0</b><span>Faol xodim</span></div>
          <div class="stat green"><b id="ovSent">0</b><span>Yuborgan</span></div>
          <div class="stat red"><b id="ovMissed">0</b><span>Yubormagan</span></div>
          <div class="stat"><b id="ovVideosTotal">0</b><span>Jami video</span></div>
          <div class="stat"><b id="ovStorage">0</b><span>Hajm</span></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Xodimlar holati — <span id="ovDayLabel"></span></div>
        <div id="ovList"></div>
      </div>
    </section>

    <!-- ===== Videolar ===== -->
    <section id="tab-videos" hidden>
      <div class="card">
        <div class="row">
          <div>
            <label class="small muted" for="fUser">Xodim</label>
            <select id="fUser"><option value="">Barchasi</option></select>
          </div>
          <div>
            <label class="small muted" for="fFrom">Dan</label>
            <input type="date" id="fFrom" />
          </div>
          <div>
            <label class="small muted" for="fTo">Gacha</label>
            <input type="date" id="fTo" />
          </div>
          <div>
            <label class="small muted" for="fStatus">Holat</label>
            <select id="fStatus">
              <option value="">Barchasi</option>
              <option value="new">Yangi</option>
              <option value="accepted">Qabul qilingan</option>
              <option value="rejected">Rad etilgan</option>
            </select>
          </div>
          <div class="fixed">
            <button class="btn" id="fApply">Filtrlash</button>
          </div>
          <div class="fixed">
            <button class="btn ghost" id="fReset">Tozalash</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Kelib tushgan videolar (<span id="vidTotal">0</span>)</div>
        <div id="vidList"></div>
        <div class="row" style="justify-content:center;margin-top:14px" id="pager"></div>
      </div>
    </section>

    <!-- ===== Xodimlar ===== -->
    <section id="tab-users" hidden>
      <div class="card">
        <div class="row" style="justify-content:space-between">
          <div class="card-title" style="margin:0">Xodimlar ro‘yxati</div>
          <div class="fixed"><button class="btn" id="addUserBtn">+ Yangi xodim</button></div>
        </div>
      </div>
      <div class="card">
        <div id="userList"></div>
      </div>
    </section>
  </main>

  <!-- Video ko'rish oynasi -->
  <div class="modal-bg" id="videoModal" hidden>
    <div class="modal lg">
      <div class="modal-head">
        <h3 id="vmTitle">Video</h3>
        <button class="icon-btn" data-close="videoModal" aria-label="Yopish">✕</button>
      </div>
      <div id="vmBody"></div>
    </div>
  </div>

  <!-- Xodim qo'shish / tahrirlash -->
  <div class="modal-bg" id="userModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="umTitle">Yangi xodim</h3>
        <button class="icon-btn" data-close="userModal" aria-label="Yopish">✕</button>
      </div>
      <div class="alert error" id="umErr" hidden></div>
      <form id="userForm">
        <input type="hidden" id="umId" />
        <div class="field">
          <label for="umFullName">F.I.Sh.</label>
          <input type="text" id="umFullName" placeholder="Aliyev Vali" required />
        </div>
        <div class="field">
          <label for="umPosition">Lavozimi</label>
          <input type="text" id="umPosition" placeholder="Operator" />
        </div>
        <div class="field" id="umUsernameField">
          <label for="umUsername">Login</label>
          <input type="text" id="umUsername" placeholder="aliyev" autocapitalize="none" spellcheck="false" />
        </div>
        <div class="field">
          <label for="umPassword"><span id="umPwLabel">Parol</span></label>
          <input type="password" id="umPassword" placeholder="kamida 5 ta belgi" autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="umRole">Rol</label>
          <select id="umRole">
            <option value="user">Xodim</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn ghost" data-close="userModal">Bekor qilish</button>
          <button type="submit" class="btn">Saqlash</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Xodim kalendari -->
  <div class="modal-bg" id="calModal" hidden>
    <div class="modal">
      <div class="modal-head">
        <h3 id="cmTitle">Kalendar</h3>
        <button class="icon-btn" data-close="calModal" aria-label="Yopish">✕</button>
      </div>
      <div class="cal-head">
        <button class="icon-btn" id="cmPrev">‹</button>
        <div class="cal-month" id="cmMonth">—</div>
        <button class="icon-btn" id="cmNext">›</button>
      </div>
      <div class="weekdays">
        <span>Du</span><span>Se</span><span>Ch</span><span>Pa</span><span>Ju</span>
        <span class="we">Sh</span><span class="we">Ya</span>
      </div>
      <div class="calendar" id="cmCalendar"></div>
      <div class="stats" style="margin-top:16px">
        <div class="stat green"><b id="cmSent">0</b><span>Yuborilgan</span></div>
        <div class="stat red"><b id="cmMissed">0</b><span>Yuborilmagan</span></div>
      </div>
    </div>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
