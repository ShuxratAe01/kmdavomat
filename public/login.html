      <h1>Davomat tizimi</h1>
      <p class="sub">Hisobingizga kiring</p>

      <div class="alert error" id="err" hidden></div>

      <!-- Maktab tanlash (asosiy usul) -->
      <div class="field" id="schoolField">
        <label for="school">Maktabingiz</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 21h18M5 21V10l7-5 7 5v11" />
            <path d="M10 21v-5h4v5" />
          </svg>
          <select id="school">
            <option value="">Yuklanmoqda…</option>
          </select>
        </div>
      </div>

      <!-- Admin uchun: login qo'lda yoziladi -->
      <div class="field" id="usernameField" hidden>
        <label for="username">Login</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.6" />
            <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" />
          </svg>
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="admin" />
        </div>
      </div>

      <div class="field">
        <label for="password">Parol</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10" rx="2.6" />
            <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9" />
          </svg>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required />
        </div>
      </div>

      <button class="btn big" type="submit" id="submitBtn">Kirish</button>

      <p class="small muted" style="text-align:center;margin:16px 0 0" id="regHint">
        Maktabingiz hali ro‘yxatdan o‘tmaganmi?
        <a href="/royxat">Ro‘yxatdan o‘tish</a>
      </p>
      <p class="small muted" style="text-align:center;margin:6px 0 0">
        Parolni unutsangiz administratorga murojaat qiling.
      </p>
      <p class="small muted" style="text-align:center;margin:12px 0 0">
        <a href="#" id="toggleMode">Administrator sifatida kirish</a>
      </p>

  <script src="/js/login.js"></script>
  <script>
    (function () {
      const svg = document.querySelector('.login-logo-svg');
      const nib = svg && svg.querySelector('.km-nib');
      if (!svg || !nib || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

      const strokes = [
        { id: 'kmP1', delay: 360, ms: 480 },
        { id: 'kmP2', delay: 840, ms: 260 },
        { id: 'kmP3', delay: 1100, ms: 1680 },
        { id: 'kmP4', delay: 2780, ms: 220 },
        { id: 'kmP5', delay: 3000, ms: 280 },
        { id: 'kmP6', delay: 3280, ms: 420 }
      ];

      const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
      const t0 = performance.now();

      function tick(now) {
        const elapsed = now - t0;
        let active = null;
        let p = 0;

        for (const s of strokes) {
          if (elapsed >= s.delay && elapsed < s.delay + s.ms) {
            active = s;
            p = ease((elapsed - s.delay) / s.ms);
            break;
          }
          if (elapsed >= s.delay + s.ms) {
            active = s;
            p = 1;
          }
        }

        if (elapsed > 3720) {
          nib.setAttribute('opacity', '0');
          return;
        }

        if (active && elapsed >= 360) {
          const path = document.getElementById(active.id);
          const len = path.getTotalLength();
          const at = Math.min(len, Math.max(0, p * len));
          const a = path.getPointAtLength(at);
          const b = path.getPointAtLength(Math.min(len, at + 1.5));
          const ang = (Math.atan2(b.y - a.y, b.x - a.x) * 180) / Math.PI + 90;
          nib.setAttribute('opacity', '1');
          nib.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${ang})`);
        } else {
          nib.setAttribute('opacity', '0');
        }
        requestAnimationFrame(tick);
      }

      requestAnimationFrame(tick);
    })();
  </script>
