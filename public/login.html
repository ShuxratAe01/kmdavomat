<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kirish — Davomat</title>
  <link rel="preload" as="image" href="/img/logo.png" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" type="image/png" href="/img/mark.png" />
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png" />
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-logo" id="loginLogo">
        <svg class="login-logo-svg" viewBox="0 0 460 327" role="img" aria-label="Kelajak Markazlari">
          <defs>
            <!-- Yozuvni chapdan o‘ngga ochib boruvchi yumshoq, biroz qiya chegara -->
            <linearGradient id="kmInk" gradientUnits="userSpaceOnUse" x1="-22" y1="-4.7" x2="0" y2="0">
              <stop offset="0" stop-color="#fff" />
              <stop offset="1" stop-color="#000" />
            </linearGradient>
            <!-- Emblemani yuqoridan pastga ochuvchi chegara -->
            <linearGradient id="kmDrop" gradientUnits="userSpaceOnUse" x1="0" y1="-12" x2="0" y2="26">
              <stop offset="0" stop-color="#fff" />
              <stop offset="1" stop-color="#000" />
            </linearGradient>

            <!-- Emblema egallagan soha (o‘lchab olingan) -->
            <clipPath id="kmEmblemArea" clipPathUnits="userSpaceOnUse">
              <rect x="98" y="0" width="252" height="164" />
              <rect x="198" y="164" width="152" height="20" />
            </clipPath>
            <!-- Yozuv sohasi: "MARKAZLARI" bundan tashqarida, u keyinroq chiqadi -->
            <clipPath id="kmScriptArea" clipPathUnits="userSpaceOnUse">
              <path clip-rule="evenodd"
                    d="M-620 -80H1080V420H-620Z M267 276H386V302H267Z" />
            </clipPath>

            <mask id="kmMask" maskUnits="userSpaceOnUse">
              <g clip-path="url(#kmEmblemArea)">
                <rect class="km-emblem" x="80" y="-240" width="300" height="266" fill="url(#kmDrop)" />
              </g>
              <g clip-path="url(#kmScriptArea)">
                <rect class="km-write" x="-620" y="-80" width="1700" height="500" fill="url(#kmInk)" />
              </g>
              <rect class="km-sub" x="266" y="275" width="121" height="28" fill="#fff" />
            </mask>
          </defs>

          <image href="/img/logo.png" width="460" height="327" mask="url(#kmMask)" />
        </svg>
      </div>
      <h1>Davomat tizimi</h1>
      <p class="sub">Hisobingizga kiring</p>

      <div class="alert error" id="err" hidden></div>

      <!-- Maktab tanlash — raqam/nom yozib qidiriladi -->
      <div class="field" id="schoolField">
        <label for="schoolSearch">Maktabingiz</label>
        <div id="schoolPicker" data-loading="1"></div>
        <div class="small muted" style="margin-top:6px">
          Raqamni yozing — masalan <b>12</b> — maktab darhol topiladi
        </div>
      </div>

      <!-- Admin uchun: login qo'lda yoziladi -->
      <div class="field" id="usernameField" hidden>
        <label for="username">Login</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.6" />
            <path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6" />
          </svg>
          <input type="text" id="username" name="username" autocomplete="username"
                 autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="admin" />
        </div>
      </div>

      <div class="field">
        <label for="password">Parol</label>
        <div class="input-wrap">
          <svg class="input-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10.5" width="16" height="10" rx="2.6" />
            <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9" />
          </svg>
          <input type="password" id="password" name="password" autocomplete="current-password"
                 placeholder="••••••••" required />
          <button type="button" class="pw-toggle" id="pwToggle"
                  aria-label="Parolni ko‘rsatish" aria-pressed="false">
            <svg class="pw-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <g class="pw-eye-socket">
                <path d="M2.5 12s3.6-6.5 9.5-6.5S21.5 12 21.5 12 17.9 18.5 12 18.5 2.5 12 2.5 12Z" />
                <circle class="pw-eye-pupil" cx="12" cy="12" r="2.55" />
              </g>
              <g class="pw-eye-lashes">
                <path d="M7 10.4 5.5 8.4" />
                <path d="M12 9.8V7.4" />
                <path d="M17 10.4 18.5 8.4" />
              </g>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn big" type="submit" id="submitBtn">Kirish</button>

      <p class="small muted" style="text-align:center;margin:16px 0 0" id="regHint">
        Maktabingiz hali ro‘yxatdan o‘tmaganmi?
        <a href="/royxat">Ro‘yxatdan o‘tish</a>
      </p>
      <p class="small muted" style="text-align:center;margin:6px 0 0">
        Parolni unutsangiz administratorga murojaat qiling.
      </p>
      <p class="small muted" style="text-align:center;margin:12px 0 0">
        <a href="#" id="toggleMode">Administrator sifatida kirish</a>
      </p>
    </form>
  </div>

  <script src="/js/school-picker.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
